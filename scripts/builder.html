<!doctype html>
<meta charset="utf-8">
<title>JTI Report Builder</title>
<style>
  :root { --navy:#1C3971; --ink:#1A1D21; --muted:#7A828C; --rule:#D8DCE2; --fill:#F4F6F8; }
  * { box-sizing:border-box }
  body { margin:0; font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         color:var(--ink); background:#fff }
  header { background:var(--navy); color:#fff; padding:16px 28px; position:sticky; top:0; z-index:5 }
  header h1 { margin:0; font-size:18px }
  header .root { font-size:12px; opacity:.75; margin-top:2px }
  main { max-width:1000px; margin:0 auto; padding:24px 28px 80px }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted);
       margin:30px 0 10px; border-bottom:1px solid var(--rule); padding-bottom:6px }
  h2:first-of-type { margin-top:6px }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px }
  input[type=text], textarea, select {
    width:100%; padding:8px 10px; border:1px solid var(--rule); border-radius:5px;
    font:inherit; color:var(--ink); background:#fff }
  input:focus, textarea:focus, select:focus { outline:2px solid rgba(28,57,113,.25); border-color:var(--navy) }
  textarea { min-height:76px; resize:vertical }
  .row { display:flex; gap:12px } .row > * { flex:1 }
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:14px }
  .card { border:2px solid var(--rule); border-radius:8px; padding:10px; cursor:pointer;
          background:#fff; text-align:left; font:inherit; color:inherit }
  .card:hover { border-color:#B9C0CA }
  .card.sel { border-color:var(--navy); box-shadow:0 0 0 3px rgba(28,57,113,.10) }
  .card img { width:100%; height:186px; object-fit:cover; object-position:top;
              border:1px solid var(--rule); border-radius:4px; background:var(--fill) }
  .card .t { font-weight:700; margin:8px 0 2px } .card .d { font-size:12px; color:var(--muted) }
  /* The "match a picture" card has no preview to show until one is uploaded. */
  .card .ph { height:186px; display:flex; align-items:center; justify-content:center;
              border:1px dashed var(--rule); border-radius:4px; background:var(--fill);
              color:var(--muted); font-size:26px; text-align:center; padding:10px;
              word-break:break-word }
  .pick { margin-top:14px }
  .sec { border:1px solid var(--rule); border-radius:8px; padding:14px; margin-bottom:12px }
  .sec .hd { display:flex; gap:12px; align-items:flex-end; margin-bottom:10px }
  table { width:100%; border-collapse:collapse } td { padding:3px 4px 3px 0; vertical-align:top }
  th { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
       text-align:left; padding:0 4px 4px 0; font-weight:600 }
  button { font:inherit; border-radius:5px; cursor:pointer }
  .mini { background:#fff; border:1px solid var(--rule); padding:4px 10px; color:var(--ink) }
  .mini:hover { border-color:var(--navy) }
  .mini.on { border-color:var(--navy); background:var(--navy); color:#fff }
  .x { background:none; border:none; color:var(--muted); font-size:16px; padding:0 6px; line-height:1 }
  .x:hover { color:#B3261E }
  .go { background:var(--navy); color:#fff; border:none; padding:11px 22px; font-weight:600; font-size:15px }
  .go:disabled { background:#9AA3B0; cursor:not-allowed }
  .out { margin-top:16px; padding:14px 16px; border-radius:6px }
  .out.ok { background:#EDF7ED; border:1px solid #BFE0BF }
  .out.err { background:#FDECEA; border:1px solid #F0C2BD }
  code { background:var(--fill); padding:2px 6px; border-radius:4px; font-size:13px;
         font-family:ui-monospace,Menlo,monospace }
  pre { background:var(--ink); color:#F2F4F7; padding:12px 14px; border-radius:6px;
        overflow-x:auto; font-size:13px; margin:10px 0 0 }
  .hint { font-size:12px; color:var(--muted); margin:-4px 0 12px }
  .modal { position:fixed; inset:0; background:rgba(26,29,33,.45); display:flex;
           align-items:center; justify-content:center; z-index:20 }
  .sheet { background:#fff; border-radius:10px; width:min(620px,92vw); max-height:78vh;
           display:flex; flex-direction:column; overflow:hidden }
  .sheet h3 { margin:0; padding:14px 18px; border-bottom:1px solid var(--rule); font-size:15px }
  .sheet .body { overflow:auto; padding:6px 0 }
  .sheet .foot { border-top:1px solid var(--rule); padding:12px 18px; display:flex;
                 justify-content:space-between; align-items:center; gap:12px }
  .dir { display:flex; width:100%; gap:10px; align-items:center; padding:9px 18px;
         border:none; background:none; text-align:left; font:inherit; cursor:pointer }
  .dir:hover { background:var(--fill) }
  /* Folders that already hold a report. Still navigable - you may want to look inside -
     but visibly not a destination, rather than tagged with a jargon pill that read like a
     file type. */
  .dir.taken .n { color:var(--muted) }
  .dir.taken .m { font-style:italic }
  .dir .n { flex:1 } .dir .m { font-size:12px; color:var(--muted) }
  .crumb { font-size:12px; color:var(--muted); padding:8px 18px; word-break:break-all }
  .spin { padding:40px; text-align:center; color:var(--muted) }
  .quick { display:flex; gap:6px; align-items:center; padding:10px 18px;
           border-bottom:1px solid var(--rule) }
  .quick input { flex:1; font-size:12px; padding:5px 8px }
  .quick + .quick { border-top:none; padding-top:0 }
  input[type=file] { font-size:13px; padding:8px; border:1px dashed var(--rule);
                     border-radius:6px; width:100%; background:var(--fill) }
  .actions { flex-wrap:wrap; margin-top:8px }
  .pathnote { padding:0 18px 10px; font-size:11px; color:var(--muted);
              border-bottom:1px solid var(--rule) }
  .warn { margin:0; padding:9px 18px; background:#FFF6E5; border-bottom:1px solid #F0DFB8;
          font-size:12px; color:#7A5B12 }
  .warn.err2 { background:#FDECEA; border-color:#F0C2BD; color:#8C2F26 }
  /* Utilities. React rejects a string `style` prop (error #62), so inline styles are
     classes here rather than object literals scattered through the JS. */
  .end { align-items:flex-end }
  .fix { flex:0 0 auto; padding:8px 14px }
  .mt12 { margin-top:12px } .ml12 { margin-left:12px }
  .note { font-size:12px; color:var(--muted) }
  .note.mt8 { margin-top:8px }
  .actions { display:flex; gap:8px }
  .go.sm { padding:7px 16px; font-size:14px }
  .foot2 { margin-top:30px; padding-top:18px; border-top:1px solid var(--rule) }
  .banner { background:#FFF6E5; border-bottom:1px solid #F0DFB8; color:#7A5B12;
            padding:9px 28px; font-size:13px }
  /* Live: is Claude parked on /api/wait right now. Grey until it says yes. */
  .watch { margin-left:12px; font-size:12px; color:var(--muted) }
  .watch.on { color:#1E6B34; font-weight:600 }
  .c1 { width:32% } .c2 { width:13% } .c3 { width:15% } .c4 { width:30px }
  .p1 { width:45% }
</style>
<div id="app" class="spin">Loading…</div>
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/vendor/htm.umd.js"></script>
<script src="/app.js"></script>
